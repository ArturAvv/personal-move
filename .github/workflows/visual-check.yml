name: Mobile visual check
on:
  push:
    paths:
      - 'index.html'
      - 'assets/exercises/**'
      - '.github/scripts/visual-check.mjs'
      - '.github/workflows/visual-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Start local preview server
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/personal-move-http.log 2>&1 &
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8765/ >/dev/null && break; sleep 1; done
      - name: Test all ten exercises at mobile width
        run: node .github/scripts/visual-check.mjs
      - name: Upload screenshots and machine-readable report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: personal-move-mobile-screenshots
          path: visual-results/
          retention-days: 14
