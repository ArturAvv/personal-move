name: Save corrected Bird Dog photo
on:
  push:
    paths:
      - '.github/workflows/store-bird-dog.yml'
      - '.github/exercise-photo-import.txt'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  save-photo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and convert corrected photo
        run: |
          python3 -m pip install pillow
          python3 - <<'PY'
          import urllib.request, pathlib, io
          from PIL import Image
          for row in pathlib.Path('.github/exercise-photo-import.txt').read_text().splitlines():
              name,url=row.split(chr(9),1)
              if name not in ('calf-raises-1','calf-raises-2','bird-dog-2'):
                  raise ValueError('Unexpected image: '+name)
              request=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
              with urllib.request.urlopen(request,timeout=90) as response:
                  data=response.read()
              img=Image.open(io.BytesIO(data)).convert('RGB')
              if min(img.size)<600:
                  raise ValueError('Unexpectedly small image: '+name)
              dest=pathlib.Path('assets/exercises')/(name+'.jpg')
              dest.parent.mkdir(parents=True,exist_ok=True)
              img.save(dest,'JPEG',quality=91,optimize=True)
              print('Saved',dest,img.size,dest.stat().st_size)
          PY
      - name: Commit permanent image
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/exercises/calf-raises-1.jpg assets/exercises/calf-raises-2.jpg assets/exercises/bird-dog-2.jpg
          git diff --cached --quiet || git commit -m 'Save corrected matching Bird Dog second frame'
          git push
