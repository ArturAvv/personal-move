name: Save corrected Bird Dog photo
on:
  push:
    paths:
      - '.github/workflows/store-bird-dog.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  save-photo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and convert corrected photo
        run: |
          python3 -m pip install pillow
          python3 - <<'PY'
          import urllib.request, pathlib, io
          from PIL import Image
          url=pathlib.Path('.github/bird-dog-photo-url.txt').read_text().strip()
          request=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
          with urllib.request.urlopen(request,timeout=90) as response:
              data=response.read()
          img=Image.open(io.BytesIO(data)).convert('RGB')
          if img.width < 600 or img.height < 400:
              raise ValueError('Unexpectedly small generated photo')
          dest=pathlib.Path('assets/exercises/bird-dog-2.jpg')
          dest.parent.mkdir(parents=True,exist_ok=True)
          img.save(dest,'JPEG',quality=91,optimize=True)
          print('Saved',dest,img.size,dest.stat().st_size)
          PY
      - name: Commit permanent image
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/exercises/bird-dog-2.jpg
          git diff --cached --quiet || git commit -m 'Save corrected matching Bird Dog second frame'
          git push
