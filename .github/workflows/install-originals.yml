name: Install full resolution exercise images
on:
  push:
    paths:
      - 'personal-move-level2-originals.zip'
      - '.github/workflows/install-originals.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Extract and verify originals
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import struct
          archive = Path('personal-move-level2-originals.zip')
          assert archive.is_file(), 'ZIP not present at repository root'
          names = ['level2-calf-flat.png','level2-calf-raised.png','level2-twist-left.jpg','level2-twist-right.jpg','level2-jacks-stand.png','level2-jacks-star.png']
          out = Path('assets/level2')
          out.mkdir(parents=True, exist_ok=True)
          with ZipFile(archive) as z:
              assert set(z.namelist()) == set(names), f'Unexpected ZIP contents: {z.namelist()}'
              assert z.testzip() is None, 'Damaged ZIP'
              for name in names:
                  data = z.read(name)
                  assert len(data) > 100000, f'Too small: {name}'
                  if name.endswith('.png'):
                      assert data.startswith(bytes.fromhex('89504e470d0a1a0a')), f'Invalid PNG: {name}'
                      width, height = struct.unpack('>II', data[16:24])
                      assert width >= 700 and height >= 900, f'Not full size: {name} {width}x{height}'
                      print(f'{name}: {width}x{height}, {len(data)} bytes')
                  else:
                      assert data.startswith(bytes.fromhex('ffd8')), f'Invalid JPEG: {name}'
                      print(f'{name}: JPEG {len(data)} bytes')
                  (out / name).write_bytes(data)
          PY
          git status --short
      - name: Commit six verified images
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/level2/level2-calf-flat.png assets/level2/level2-calf-raised.png assets/level2/level2-twist-left.jpg assets/level2/level2-twist-right.jpg assets/level2/level2-jacks-stand.png assets/level2/level2-jacks-star.png
          if ! git diff --cached --quiet; then
            git commit -m 'Install six approved full resolution exercise photos'
            git push origin HEAD:main
          fi
