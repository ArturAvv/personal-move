<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#f6f5f1"><title>Personal Move — демо</title>
<style>
:root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#24312c;background:#f6f5f1;font-synthesis:none}*{box-sizing:border-box}body{margin:0}button{font:inherit;cursor:pointer}button:focus-visible{outline:3px solid #537d6d;outline-offset:3px}.app{max-width:680px;margin:auto;min-height:100dvh;padding:calc(20px + env(safe-area-inset-top)) 20px calc(28px + env(safe-area-inset-bottom))}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:25px}.brand{font-size:21px;font-weight:800;letter-spacing:-.8px}.brand span{color:#698f80}.pill{border-radius:40px;background:#e8ede7;padding:9px 12px;color:#4f6e5e;font-size:12px;font-weight:700}.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:2px;color:#698779;font-weight:800;margin-bottom:9px}h1{font-size:clamp(29px,7vw,41px);line-height:1.09;letter-spacing:-1.5px;margin:0 0 12px}h2{font-size:25px;letter-spacing:-.7px;margin:0 0 12px}p{line-height:1.55;color:#6c7971;margin:0 0 18px}.choices{display:grid;gap:12px;margin-top:22px}.choice{width:100%;display:grid;grid-template-columns:92px 1fr 22px;align-items:center;text-align:left;gap:14px;border:1px solid #e0e5de;border-radius:22px;background:white;padding:11px;min-height:124px;color:inherit;box-shadow:0 4px 16px #27392b09}.choice:active,.tile:active{transform:scale(.99)}.art{height:100px;border-radius:15px;display:grid;place-items:center;font-size:47px;background:#e8eee6}.choice:nth-child(2) .art{background:#f1e8df}.choice:nth-child(3) .art{background:#e7e9f0}.choice b{display:block;font-size:17px;line-height:1.2;margin-bottom:6px}.choice small{font-size:12px;color:#78857c;line-height:1.35;display:block}.arrow{font-size:25px;color:#7a9688}.back{border:0;background:transparent;color:#587866;font-weight:750;padding:10px 0;margin-bottom:12px}.tile{background:white;border:1px solid #e1e6df;border-radius:18px;padding:16px;text-align:left;color:inherit;width:100%;margin:6px 0}.tile.selected{border:2px solid #5b8873;background:#f0f6ef;padding:15px}.tile strong{display:block;font-size:16px;margin-bottom:5px}.tile small{color:#728077;line-height:1.4}.btn{border:0;border-radius:17px;background:#315d4c;color:white;font-weight:750;padding:17px 20px;width:100%;margin-top:14px}.btn.secondary{background:#e5eee7;color:#315d4c}.btn:disabled{opacity:.4;cursor:not-allowed}.subtle{font-size:12px;color:#89948b;margin-top:15px}.week{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:7px;margin:22px 0}.day{border-radius:13px;background:#e8eee7;padding:11px 3px;text-align:center;font-size:11px;color:#587164}.day b{display:block;font-size:17px;margin-top:4px}.day.current{background:#315d4c;color:white}.day.done{background:#b9d5c5;color:#254736}.exercise{background:white;border:1px solid #e0e5df;border-radius:20px;padding:18px;margin:12px 0}.exercise .emoji{font-size:42px;margin-bottom:12px}.exercise h3{font-size:20px;margin:0 0 8px}.exercise .meta{font-size:13px;font-weight:750;color:#5a7d69;margin-bottom:10px}.progress{height:8px;background:#e0e9e1;border-radius:20px;overflow:hidden;margin:14px 0 22px}.progress div{height:100%;background:#6b9981;transition:width .2s}.counter{color:#698778;font-weight:700;font-size:13px}.summary{border-radius:22px;padding:24px;background:#e8efe6;text-align:center;margin-top:25px}.summary .big{font-size:52px;margin-bottom:12px}.muted{font-size:13px;color:#7c8980}.note{border-left:3px solid #9db9a4;padding:10px 13px;background:#eef1ea;border-radius:0 10px 10px 0;font-size:13px;color:#617365;line-height:1.5;margin:20px 0}.footer{font-size:11px;color:#96a096;text-align:center;margin-top:32px}@media(max-height:720px){.app{padding-top:14px}.top{margin-bottom:12px}.choices{gap:8px;margin-top:12px}.choice{min-height:105px}.art{height:82px}h1{font-size:30px}p{margin-bottom:10px}}@media(min-width:700px){.app{padding-top:50px}.choices{gap:18px}.choice{min-height:145px}}
</style></head><body><main id="app" class="app"></main><script>
"use strict";
const tracks=[
{id:"mobility",name:"Йога и мобильность",desc:"Мягкая растяжка, суставы и контроль движений",emoji:"🧘",short:"Мобильность"},
{id:"home",name:"Домашние тренировки",desc:"Простые силовые упражнения без оборудования",emoji:"🏠",short:"Домашние"},
{id:"focus",name:"Работа над отдельными мышцами",desc:"Плечи, спина, ноги и корпус",emoji:"💪",short:"Мышцы"}];
const levels=[{name:"Начальный",desc:"Мягкий старт, простые движения и больше пауз"},{name:"Средний",desc:"Умеренная нагрузка, уверенный темп"},{name:"Продвинутый",desc:"Для тех, кто уже регулярно занимается"}];
const library={
mobility:[
["Кошка — корова","На четвереньках плавно округляй и прогибай спину без боли.","8–12 повторений","🐈"],
["Круги плечами","Медленно вращай плечами назад и вперёд, без рывков.","30–45 секунд","🔄"],
["Поза ребёнка","Опустись тазом к пяткам, вытягивай руки вперёд, дыши ровно.","30–45 секунд","🌿"],
["Повороты грудного отдела","На четвереньках разворачивай грудь, ведя локоть к потолку.","6–10 на сторону","🌤️"],
["Мягкий выпад","Сделай небольшой выпад и осторожно потяни переднюю поверхность бедра задней ноги.","20–30 секунд на сторону","🌱"],
["Наклоны таза лёжа","Лёжа на спине мягко подкручивай таз, не задерживая дыхание.","10–12 повторений","🫧"]],
home:[
["Приседания к стулу","Отводи таз назад, легко коснись стула и вставай, удерживая стопы на полу.","8–12 повторений","🪑"],
["Отжимания от стены","Упрись ладонями в стену, сгибай локти и возвращайся обратно.","8–12 повторений","🙌"],
["Ягодичный мост","Лёжа на спине, согни колени и плавно поднимай таз.","10–15 повторений","🌉"],
["Птица — собака","На четвереньках вытягивай противоположные руку и ногу, сохраняя равновесие.","6–10 на сторону","🐦"],
["Подъёмы на носки","Держась за опору, плавно поднимайся на носки и опускайся.","12–15 повторений","🦶"],
["Планка у стола","Упрись руками в устойчивый стол и держи корпус прямым.","20–30 секунд","📐"]],
focus:[
["Разведение рук без веса","Медленно поднимай прямые, но не заблокированные руки в стороны до комфортной высоты.","10–12 повторений","🪽"],
["Сведение лопаток","Стоя ровно, мягко своди лопатки, не поднимая плечи к ушам.","10–12 повторений","🎯"],
["Приседания к стулу","Опускайся к устойчивому стулу и поднимайся без рывков.","8–12 повторений","🪑"],
["Мёртвый жук","Лёжа на спине, попеременно опускай противоположные руку и ногу, сохраняя поясницу устойчивой.","6–10 на сторону","🐞"],
["Ягодичный мост","Лёжа на спине, медленно поднимай таз и опускай.","10–15 повторений","🌉"],
["Подъёмы на носки","С опорой поднимай пятки от пола и медленно опускай.","12–15 повторений","🦶"]]};
let state={page:"home",track:null,level:0,day:1,step:0,done:[]};
try{const saved=JSON.parse(localStorage.getItem("pm-demo-v1"));if(saved&&tracks.some(t=>t.id===saved.track)){state={...state,...saved,page:"plan",step:0};if(!Array.isArray(state.done))state.done=[]}}catch(e){}
const el=document.getElementById("app");
const save=()=>{try{localStorage.setItem("pm-demo-v1",JSON.stringify({...state,page:"plan",step:0}))}catch(e){}};
const safe=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function header(){return '<div class="top"><div class="brand">personal<span>move.</span></div><div class="pill">ДЕМО • 6 ДНЕЙ</div></div>'}
function go(page){state.page=page;render();window.scrollTo(0,0)}
function current(){return tracks.find(t=>t.id===state.track)}
function routine(day){const a=library[state.track]||library.home;const shift=(day-1)*2;return [a[shift%6],a[(shift+1)%6],a[(shift+2)%6]]}
function rest(day){return day===3||day===6}
function render(){
let html=header();
if(state.page==="home"){html+='<div class="eyebrow">Движение каждый день</div><h1>Найди свой способ двигаться</h1><p>Короткие занятия по 5–15 минут. Выбери то, что тебе ближе.</p><div class="choices">'+tracks.map(t=>'<button class="choice" data-track="'+t.id+'"><div class="art" aria-hidden="true">'+t.emoji+'</div><div><b>'+t.name+'</b><small>'+t.desc+'</small></div><span class="arrow" aria-hidden="true">›</span></button>').join("")+'</div><div class="footer">Начни с комфортного темпа • без спешки</div>'}
if(state.page==="levels"){const t=current();html+='<button class="back" data-go="home">← Все направления</button><div class="eyebrow">'+t.short+'</div><h1>Выбери свой уровень</h1><p>Три уровня для любого направления. Можно поменять позже.</p>'+levels.map((l,i)=>'<button class="tile '+(state.level===i?"selected":"")+'" data-level="'+i+'" aria-pressed="'+(state.level===i)+'"><strong>'+l.name+'</strong><small>'+l.desc+'</small></button>').join("")+'<button class="btn" data-action="start">Составить мой план →</button>'}
if(state.page==="plan"){const t=current();const finished=state.done.length;html+='<button class="back" data-go="levels">← Изменить уровень</button><div class="eyebrow">'+t.short+' · '+levels[state.level].name+'</div><h1>Твой план на 6 дней</h1><p>4 короткие тренировки и 2 дня восстановления. Занимайся в удобном темпе.</p><div class="week">'+Array.from({length:6},(_,i)=>{const d=i+1;return '<button class="day '+(state.day===d?"current ":"")+(state.done.includes(d)?"done":"")+'" data-day="'+d+'" aria-label="День '+d+'"><span>День</span><b>'+d+'</b></button>'}).join("")+'</div>';
html+='<div class="exercise"><div class="eyebrow">День '+state.day+' из 6</div><h2>'+(rest(state.day)?"Время восстановиться":"Двигаемся вместе")+'</h2><p>'+(rest(state.day)?"Сегодня отдых. При желании — спокойная прогулка или лёгкая разминка.":"Три простых упражнения · около "+(state.level===0?"5–7":state.level===1?"8–10":"10–15")+" минут.")+'</p><div class="muted">Пройдено дней: '+finished+' / 6</div></div>';
html+='<button class="btn" data-action="open">'+(rest(state.day)?"Отметить день отдыха":"Начать тренировку →")+'</button><button class="btn secondary" data-action="reset">Начать план заново</button>'}
if(state.page==="session"){const ex=routine(state.day),item=ex[state.step];html+='<button class="back" data-go="plan">← Вернуться к плану</button><div class="eyebrow">День '+state.day+' · '+current().short+'</div><div class="counter">Упражнение '+(state.step+1)+' из '+ex.length+'</div><div class="progress"><div style="width:'+((state.step+1)/ex.length*100)+'%"></div></div><div class="exercise"><div class="emoji" aria-hidden="true">'+item[3]+'</div><h2>'+safe(item[0])+'</h2><div class="meta">'+safe(item[2])+'</div><p>'+safe(item[1])+'</p><div class="note">Дыши свободно, двигайся без боли. Если сложно, уменьши амплитуду или сделай паузу.</div></div><button class="btn" data-action="next">'+(state.step===ex.length-1?"Завершить тренировку ✓":"Следующее упражнение →")+'</button><button class="btn secondary" data-action="prev" '+(state.step===0?"disabled":"")+'>← Предыдущее</button>'}
if(state.page==="finish"){html+='<div class="summary"><div class="big">✨</div><h2>Отличная работа!</h2><p>День '+state.day+' завершён. Регулярность важнее рекордов.</p></div><button class="btn" data-action="continue">Вернуться к плану</button>'}
html+='<div class="footer">Personal Move · ознакомительная программа, не медицинская рекомендация</div>';el.innerHTML=html;
el.querySelectorAll("[data-track]").forEach(b=>b.addEventListener("click",()=>{state.track=b.dataset.track;state.level=0;state.day=1;state.done=[];go("levels")}));
el.querySelectorAll("[data-go]").forEach(b=>b.addEventListener("click",()=>go(b.dataset.go)));
el.querySelectorAll("[data-level]").forEach(b=>b.addEventListener("click",()=>{state.level=Number(b.dataset.level);render()}));
el.querySelectorAll("[data-day]").forEach(b=>b.addEventListener("click",()=>{state.day=Number(b.dataset.day);save();render()}));
el.querySelectorAll("[data-action]").forEach(b=>b.addEventListener("click",()=>action(b.dataset.action)));
}
function complete(){if(!state.done.includes(state.day))state.done.push(state.day);save();go("finish")}
function action(a){
if(a==="start"){state.day=1;state.done=[];save();go("plan")}
if(a==="open"){if(rest(state.day)){complete()}else{state.step=0;go("session")}}
if(a==="next"){if(state.step===2)complete();else{state.step++;render();window.scrollTo(0,0)}}
if(a==="prev"&&state.step>0){state.step--;render()}
if(a==="continue"){if(state.day<6)state.day++;save();go("plan")}
if(a==="reset"){if(confirm("Сбросить прогресс этого плана?")){state.day=1;state.done=[];save();render()}}
}
render();
</script></body></html>
