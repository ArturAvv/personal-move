/* Large photos, narrow gaps, unified light captions */
.guided{padding:19px 9px}
.guided .step-title,.guided .intro,.guided .technique{margin-left:7px;margin-right:7px}
.guided .poses{gap:5px;margin:12px 0 18px}
.guided .pose{background:#f2f4ef;border-radius:13px}
.guided .pose figure{aspect-ratio:3/4;background:#f2f4ef}
.guided .pose img{width:100%;height:100%;object-fit:cover;display:block}
.guided .pose figcaption{background:#f2f4ef;color:#214534;min-height:64px;padding:10px 8px;font-size:14px}
.guided .pose figcaption small{color:#647b6b;opacity:1}
.guided .poses.frames-3{gap:4px}
.guided .poses.frames-3 figcaption{font-size:12px;padding:7px 5px}

/* Compact image-first cards: no redundant frame counters, photos fill available space */
.exercise-card .poses,.guided .poses{gap:4px;margin:8px -7px 13px}
.exercise-card .pose,.guided .pose{background:#f5f6f2;border-radius:11px;overflow:hidden}
.exercise-card .pose figure,.guided .pose figure{aspect-ratio:4/5.1;overflow:hidden;background:#f5f6f2}
.exercise-card .pose img,.guided .pose img{width:100%;height:100%;object-fit:cover;object-position:center;transform:scale(1.15);display:block}
.exercise-card .pose figcaption,.guided .pose figcaption{background:#f5f6f2;color:#244737;min-height:0;padding:7px 6px 9px;font-size:13px;line-height:1.25}
.exercise-card .pose figcaption small,.guided .pose figcaption small{color:#607568;opacity:1}
.exercise-card .pose:has(figure) figure{margin:0}


/* Wide images for floor exercises; preserve full body without aggressive zoom */
.guided .poses.floor-photos,.exercise-card .poses.floor-photos{grid-template-columns:1fr;gap:9px}

function clockStop(){if(clock.job!==null){clearInterval(clock.job);clock.job=null}}

function clockDraw(){const el=document.getElementById("countdown");if(!el)return;const prep=clock.phase==="prep"||(clock.phase==="paused"&&clock.pausedFrom==="prep");const total=prep?5:timed2[clock.step];el.querySelector(".countdown-ring").style.setProperty("--progress",Math.max(0,Math.min(100,clock.left/total*100))+"%");el.querySelector(".countdown-number").textContent=Math.ceil(clock.left);el.querySelector(".countdown-phase").textContent=({idle:"Готов к старту",prep:"Приготовься",work:"Выполняй упражнение",paused:"Пауза",done:"Готово ✓"})[clock.phase];el.querySelector('[data-action="clock-toggle"]').textContent=["prep","work"].includes(clock.phase)?"Пауза":clock.phase==="paused"?"Продолжить":clock.phase==="done"?"Повторить":"Начать"}
function clockTick(){if(!["prep","work"].includes(clock.phase))return;clock.left=Math.max(0,(clock.until-Date.now())/1000);if(clock.left<=0){if(clock.phase==="prep"){clock.phase="work";clock.left=timed2[clock.step];clock.until=Date.now()+clock.left*1000}else{clock.phase="done";clockStop()}}clockDraw()}
function clockPause(){if(["prep","work"].includes(clock.phase)){clockTick();if(["prep","work"].includes(clock.phase)){clock.pausedFrom=clock.phase;clock.phase="paused";clockStop();clockDraw()}}}
function clockToggle(){if(clock.step!==state.step2)clockReset(state.step2);if(["prep","work"].includes(clock.phase))clockPause();else{if(clock.phase==="paused")clock.phase=clock.pausedFrom;else{clock.phase="prep";clock.left=5}clock.until=Date.now()+clock.left*1000;clock.job=setInterval(clockTick,100)}clockDraw()}
