<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#102b25"><title>Personal Move — двигайся в своём ритме</title>
<style>
:root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#16392d;background:#f4f6f1;font-synthesis:none}*{box-sizing:border-box}body{margin:0}button{font:inherit;cursor:pointer}button:focus-visible{outline:3px solid #b4df70;outline-offset:3px}button:disabled{cursor:default}.app{max-width:640px;margin:auto;min-height:100dvh;padding:0 18px calc(30px + env(safe-area-inset-bottom))}.header{height:74px;display:flex;align-items:center;justify-content:space-between}.logo{font-weight:900;letter-spacing:-1px;font-size:22px}.logo span{color:#73a654}.tag{font-size:11px;font-weight:800;letter-spacing:.1em;background:#e3eddd;color:#547452;padding:9px 12px;border-radius:50px}.eyebrow{text-transform:uppercase;letter-spacing:.16em;font-size:11px;font-weight:850;color:#648a63;margin-bottom:10px}h1{font-size:clamp(31px,7.7vw,43px);letter-spacing:-1.6px;line-height:1.06;margin:0 0 12px}h2{font-size:25px;letter-spacing:-.9px;line-height:1.15;margin:0 0 12px}p{line-height:1.55;color:#688074;margin:0 0 16px;font-size:14px}.hero{height:295px;border-radius:27px;position:relative;overflow:hidden;color:white;background:linear-gradient(180deg,#17372a0d,#0b261be8),url('https://images.unsplash.com/photo-1470770841072-f978cf4d019e?w=1300&q=85') center/cover}.hero-inner{position:absolute;bottom:22px;left:22px;right:20px}.hero .eyebrow{color:#d0e99c}.hero h1{max-width:320px;font-size:38px}.hero p{color:#edf5e9;margin:0;max-width:290px}.section{display:flex;align-items:center;justify-content:space-between;margin:28px 2px 14px}.section h2{font-size:23px;margin:0}.section small{font-size:12px;color:#7b9485}.cards{display:grid;gap:13px}.track{border:0;width:100%;display:flex;align-items:stretch;min-height:151px;text-align:left;border-radius:22px;overflow:hidden;background:white;box-shadow:0 7px 25px #193b2510;color:#183b2f;padding:0}.track .photo{width:41%;min-width:130px;background-size:cover;background-position:center}.track .info{flex:1;padding:19px 14px 16px 17px;display:flex;flex-direction:column;justify-content:center;gap:8px}.track strong{font-size:19px;letter-spacing:-.5px;line-height:1.13}.track small{color:#7b9082;font-size:12px;line-height:1.45}.track .status{color:#648b47;font-size:11px;font-weight:800;letter-spacing:.02em}.track.locked{opacity:.76}.track.locked .status{color:#89938c}.back{display:flex;align-items:center;gap:8px;border:0;background:transparent;padding:13px 0 23px;color:#58755e;font-weight:750}.cover{height:230px;border-radius:25px;background:linear-gradient(0deg,#0d2d229e,transparent 75%),url('https://images.unsplash.com/photo-1534438327276-14e5300c3a48?w=1100&q=85') center/cover;position:relative;margin-bottom:24px}.cover span{position:absolute;bottom:19px;left:20px;color:white;font-size:12px;font-weight:800;letter-spacing:.1em}.level{width:100%;text-align:left;border:1px solid #dce7da;border-radius:19px;padding:19px;background:white;margin:7px 0;display:flex;align-items:center;justify-content:space-between;gap:14px;color:#183b2f}.level strong{font-size:18px;display:block;margin-bottom:5px}.level small{font-size:12px;line-height:1.5;color:#819487}.level.active{border:2px solid #89b765;background:#f0f7e8;padding:18px}.level.disabled{opacity:.53}.badge{background:#e2efda;border-radius:50px;padding:7px 10px;font-size:10px;font-weight:850;color:#56834d;white-space:nowrap}.btn{display:block;border:0;width:100%;border-radius:17px;background:#244b37;color:white;font-size:15px;font-weight:800;padding:17px 18px;margin-top:15px}.btn.alt{background:#e4eee0;color:#2a593f}.btn:disabled{opacity:.5}.plan-card,.exercise-card,.complete{border-radius:23px;background:white;padding:23px;box-shadow:0 6px 25px #193b2510;margin-top:17px}.mini{font-size:12px;font-weight:800;color:#73915e;text-transform:uppercase;letter-spacing:.1em}.plan-card h2{margin-top:10px}.plan-stats{display:flex;gap:8px;flex-wrap:wrap;margin:19px 0}.plan-stats span{background:#edf3e9;padding:9px 11px;border-radius:12px;font-size:12px;color:#527359;font-weight:750}.routine-list{padding:0;list-style:none;margin:15px 0}.routine-list li{display:flex;align-items:center;gap:13px;border-bottom:1px solid #e8eee8;padding:12px 0;font-size:14px;font-weight:700}.routine-list li:last-child{border:0}.num{height:29px;width:29px;border-radius:50%;display:grid;place-items:center;background:#eaf1e5;color:#6a9060;font-size:12px;flex-shrink:0}.routine-list small{display:block;color:#8a9b90;font-weight:500;font-size:12px;margin-top:4px}.counter{font-size:12px;color:#6b8d6a;font-weight:800}.bar{height:7px;border-radius:9px;background:#dfe9dc;margin:12px 0 22px;overflow:hidden}.bar div{height:100%;background:#9ec66c;transition:width .2s}.exercise-visual{height:190px;border-radius:18px;background:linear-gradient(140deg,#dbe9d4,#edf2e9);display:flex;align-items:center;justify-content:center;margin-bottom:20px;position:relative;overflow:hidden}.exercise-visual .shape{font-size:77px}.exercise-visual .label{position:absolute;bottom:12px;left:13px;font-size:10px;color:#6a8d6d;font-weight:800;text-transform:uppercase;letter-spacing:.1em}.exercise-card h2{font-size:29px}.dose{display:inline-block;background:#e7f0df;border-radius:11px;padding:9px 13px;color:#426e4c;font-weight:850;font-size:14px;margin:5px 0 19px}.exercise-card h3{font-size:13px;margin:7px 0;color:#274b35}.exercise-card p{font-size:14px;margin:0 0 16px}.hint{background:#f1f6ec;border-left:3px solid #9ac178;padding:13px;border-radius:0 11px 11px 0;font-size:13px;color:#5b7660;line-height:1.5;margin:12px 0}.actions{display:grid;grid-template-columns:1fr 2fr;gap:10px}.actions .btn{margin-top:0}.actions .btn.alt{background:#e5eee2}.complete{text-align:center;padding:35px 23px}.complete .medal{font-size:55px;margin-bottom:15px}.complete h2{font-size:30px}@media(min-width:700px){.app{padding-left:24px;padding-right:24px}.hero{height:340px}}
</style></head><body><main id="app" class="app"></main><script>
"use strict";
const exercises=[
{name:"Марш на месте",dose:"90 секунд",icon:"🚶",how:"Шагай на месте в комфортном темпе, мягко перекатывай стопу и свободно двигай руками.",tip:"Дыши ровно. Не нужно высоко поднимать колени."},
{name:"Круги плечами и движения руками",dose:"45 секунд",icon:"🙆",how:"Медленно вращай плечами назад и вперёд, затем добавь плавные движения руками.",tip:"Не зажимай шею и избегай резких рывков."},
{name:"Подъёмы на носки",dose:"12–15 повторений",icon:"🦶",how:"Встань прямо, при необходимости придерживайся за опору. Поднимись на носки и плавно опустись.",tip:"Не раскачивай корпус. Контролируй опускание."},
{name:"Сведение лопаток стоя",dose:"12–15 повторений",icon:"🪽",how:"Опусти плечи, мягко сведи лопатки, задержись на секунду и расслабься.",tip:"Не поднимай плечи к ушам и не прогибай поясницу."},
{name:"Приседания без веса",dose:"2 подхода × 10",icon:"🏋️",how:"Поставь стопы примерно на ширине плеч, отведи таз назад и присядь на комфортную глубину. Встань, отталкиваясь всей стопой.",tip:"Колени направлены примерно в сторону носков. Отдохни между подходами."},
{name:"Отжимания от пола",dose:"2 подхода × 8–10",icon:"💪",how:"Поставь ладони немного шире плеч, держи корпус прямым. Сгибай локти и выжимай себя вверх.",tip:"Облегчённый вариант — отжимания с колен. Не проваливай поясницу."},
{name:"Кошка — корова",dose:"8 циклов",icon:"🐈",how:"Встань на четвереньки. На выдохе плавно округли спину, на вдохе мягко раскрой грудной отдел.",tip:"Двигайся медленно и только в комфортной амплитуде."},
{name:"Ягодичный мостик",dose:"Удержание 20 секунд",icon:"🌉",how:"Ляг на спину, согни колени и поставь стопы на пол. Подними таз, напряги ягодицы и удерживай положение.",tip:"Не переразгибай поясницу. Продолжай спокойно дышать."},
{name:"Птица — собака",dose:"6 раз на сторону",icon:"🐕",how:"На четвереньках вытягивай противоположные руку и ногу, удерживая таз ровно. Вернись и поменяй сторону.",tip:"Облегчённый вариант — вытягивать только руку или только ногу."},
{name:"Растяжка и дыхание",dose:"1–2 минуты",icon:"🌿",how:"Мягко потяни основные мышцы, сделай несколько спокойных вдохов и более длинных выдохов.",tip:"Не растягивайся через боль. Позволь дыханию восстановиться."}
];
const key="personal-move-preview-2";let state={page:"home",step:0,finished:false};try{const s=JSON.parse(localStorage.getItem(key));if(s&&Number.isInteger(s.step)&&s.step>=0&&s.step<10)state={...state,...s,page:"home"}}catch(e){}
const root=document.getElementById("app");const save=()=>{try{localStorage.setItem(key,JSON.stringify(state))}catch(e){}};const esc=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));function go(page){state.page=page;save();render();scrollTo(0,0)}
function header(){return '<header class="header"><div class="logo">personal<span>move.</span></div><div class="tag">ДВИЖЕНИЕ В РАДОСТЬ</div></header>'}
function render(){let h=header();
if(state.page==="home"){h+='<section class="hero"><div class="hero-inner"><div class="eyebrow">Твой путь начинается здесь</div><h1>Двигайся.<br>Чувствуй.<br>Живи.</h1><p>Найди свой ритм и сделай первый шаг к себе.</p></div></section><div class="section"><h2>Выбери направление</h2><small>01 / 03</small></div><div class="cards"><button class="track locked" disabled><div class="photo" style="background-image:url(https://images.unsplash.com/photo-1544367567-0f2fcb009e0b?w=650&q=80)"></div><div class="info"><span class="status">СКОРО</span><strong>Йога и мобильность</strong><small>Гибкость, дыхание и свобода движения</small></div></button><button class="track" data-go="levels"><div class="photo" style="background-image:url(https://images.unsplash.com/photo-1534438327276-14e5300c3a48?w=650&q=80)"></div><div class="info"><span class="status">НАЧАТЬ →</span><strong>Домашние тренировки</strong><small>Сила и энергия без специального оборудования</small></div></button><button class="track locked" disabled><div class="photo" style="background-image:url(https://images.unsplash.com/photo-1583454110551-21f2fa2afe61?w=650&q=80)"></div><div class="info"><span class="status">СКОРО</span><strong>Отдельные группы мышц</strong><small>Внимание к каждой части тела</small></div></button></div>'}
if(state.page==="levels"){h+='<button class="back" data-go="home">← Все направления</button><div class="cover"><span>ДОМАШНИЕ ТРЕНИРОВКИ</span></div><div class="eyebrow">Выбери комфортный темп</div><h1>Твой уровень</h1><p>Начни с основы. Остальные уровни откроем после тестирования первой программы.</p><button class="level active" data-go="plan"><div><strong>Знакомство</strong><small>Спокойное начало · 10 упражнений · без спешки</small></div><span class="badge">ДОСТУПНО →</span></button><button class="level disabled" disabled><div><strong>Развитие</strong><small>Больше силы и уверенности в движениях</small></div><span class="badge">СКОРО</span></button><button class="level disabled" disabled><div><strong>Углублённая практика</strong><small>Для регулярных и более интенсивных занятий</small></div><span class="badge">СКОРО</span></button>'}
if(state.page==="plan"){h+='<button class="back" data-go="levels">← Уровни</button><div class="eyebrow">Домашние тренировки · Знакомство</div><h1>Твоя первая тренировка</h1><p>Десять упражнений для всего тела. Выполняй в собственном ритме: переход к следующему упражнению только по твоей команде.</p><div class="plan-card"><div class="mini">День 1 · Начало пути</div><h2>Включаем тело в движение</h2><div class="plan-stats"><span>10 упражнений</span><span>Без оборудования</span><span>Без таймера</span></div><ol class="routine-list">'+exercises.map((x,i)=>'<li><span class="num">'+(i+1)+'</span><div>'+esc(x.name)+'<small>'+esc(x.dose)+'</small></div></li>').join("")+'</ol></div><button class="btn" data-action="begin">'+(state.step>0&&!state.finished?"Продолжить тренировку →":"Начать тренировку →")+'</button>'}
if(state.page==="session"){const x=exercises[state.step];h+='<button class="back" data-go="plan">← К программе</button><div class="eyebrow">Домашние тренировки · Знакомство</div><div class="counter">Упражнение '+(state.step+1)+' из 10</div><div class="bar"><div style="width:'+((state.step+1)*10)+'%"></div></div><div class="exercise-card"><div class="exercise-visual"><span class="shape" aria-hidden="true">'+x.icon+'</span><span class="label">Техника движения</span></div><h2>'+esc(x.name)+'</h2><div class="dose">'+esc(x.dose)+'</div><h3>Как выполнять</h3><p>'+esc(x.how)+'</p><div class="hint"><strong>Обрати внимание:</strong> '+esc(x.tip)+'</div></div><div class="actions"><button class="btn alt" data-action="prev" '+(state.step===0?'disabled':'')+'>← Назад</button><button class="btn" data-action="next">'+(state.step===9?'Завершить ✓':'Готово, дальше →')+'</button></div><p style="margin-top:15px;text-align:center;font-size:12px">Нет обратного отсчёта — ты сам задаёшь темп.</p>'}
if(state.page==="complete"){h+='<button class="back" data-go="home">← На главную</button><div class="complete"><div class="medal">🌿</div><div class="eyebrow">Тренировка завершена</div><h2>Отличное начало!</h2><p>Ты прошёл все 10 упражнений. Прислушайся к самочувствию и дай телу восстановиться.</p><div class="plan-stats" style="justify-content:center"><span>10 / 10 выполнено</span><span>Знакомство</span></div></div><button class="btn" data-action="restart">Пройти ещё раз</button><button class="btn alt" data-go="home">На главную</button>'}
root.innerHTML=h;}
document.addEventListener("click",e=>{const b=e.target.closest("button");if(!b||b.disabled)return;if(b.dataset.nav==="home"||b.dataset.go){go(b.dataset.go||"home");return}const a=b.dataset.action;if(a==="begin"){if(state.finished){state.step=0;state.finished=false}go("session")}if(a==="next"){if(state.step===9){state.finished=true;go("complete")}else{state.step++;go("session")}}if(a==="prev"&&state.step>0){state.step--;go("session")}if(a==="restart"){state.step=0;state.finished=false;go("session")}});
render();
</script></body></html>
